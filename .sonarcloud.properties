# Alcance del análisis automático de SonarQube Cloud.
# Solo cuenta como código principal lo que corre en producción; drizzle/ (snapshots
# JSON de migraciones) y _debt_findings.json quedan fuera.
sonar.sources=src,scripts
sonar.tests=test
# HTML guardado del portal para los tests: no es código nuestro.
sonar.test.exclusions=test/**/fixtures/**
