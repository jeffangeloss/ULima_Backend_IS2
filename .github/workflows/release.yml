name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Crear el tag y el Release de la versión de package.json si no existen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag ya existe; no hay nada que publicar"
            exit 0
          fi
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { p = 1; next }
            p && /^## \[/ { exit }
            p { print }
          ' CHANGELOG.md > notas.md
          [ -s notas.md ] || echo "Versión $version" > notas.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notas.md
