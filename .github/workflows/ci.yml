name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pruebas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://ci:ci@localhost:5432/no-se-usa
      JWT_SECRET: secreto-solo-para-ci
      COHERE_API_KEY: clave-falsa-de-ci
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pruebas
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun test

  flujo:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: La rama de origen es develop o hotfix/*
        env:
          ORIGEN: ${{ github.head_ref }}
        run: |
          case "$ORIGEN" in
            develop|hotfix/*) echo "ok: $ORIGEN puede entrar a main" ;;
            *) echo "::error::A main solo entran PR desde develop o hotfix/*; este viene de $ORIGEN"; exit 1 ;;
          esac
